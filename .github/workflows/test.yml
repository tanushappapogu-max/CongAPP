name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pulse-point/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web dependencies
        working-directory: pulse-point
        run: npm ci

      - name: Run web and shared-core tests
        working-directory: pulse-point
        run: npm test

      - name: Build web app
        working-directory: pulse-point
        run: npm run build

      - name: Run mobile smoke validation
        working-directory: pulse-point-mobile
        run: npm run smoke

      - name: Check API syntax
        run: node --check api/ai.js

      - name: Run dependency-free server contract tests
        run: python -m unittest discover -s server -p "test_contract.py"
